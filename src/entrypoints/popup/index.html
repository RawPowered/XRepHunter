<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XRepHunter</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>XRepHunter</h1>
      <label class="toggle"><input type="checkbox" id="enabled" /> Active</label>
    </header>
    <section class="stats">
      <div><span id="scans">0</span> scans</div>
      <div><span id="flags">0</span> flags</div>
    </section>
    <p class="hint">Reputation badges appear on X profiles and timelines.</p>
    <button id="open-dashboard" class="primary">Open dashboard</button>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
