<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">XRepHunter architecture</title><desc id="desc">The browser page sends visible and selected response evidence through a content script and service worker into local detectors, optional browser models, and extension-local SQLite. The dashboard presents explanations and user-reviewed actions.</desc>
<rect width="1200" height="420" rx="4" fill="#08090A"/><path d="M0 0h370l-7 7H0z" fill="#D5FF3F"/><text x="40" y="56" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#D5FF3F">SYSTEM MAP / LOCAL REVIEW PIPELINE</text>
<g font-family="Arial,sans-serif"><g><rect x="40" y="104" width="220" height="112" fill="#111315" stroke="#36393C"/><text x="60" y="143" font-size="12" font-weight="700" letter-spacing="1.5" fill="#9EA4A9">01 / INPUT</text><text x="60" y="178" font-size="22" font-weight="700" fill="#F6F7F8">X page</text><text x="60" y="199" font-size="14" fill="#BFC3C8">DOM + selected responses</text></g>
<g><rect x="330" y="104" width="220" height="112" fill="#111315" stroke="#36393C"/><text x="350" y="143" font-size="12" font-weight="700" letter-spacing="1.5" fill="#9EA4A9">02 / EXTENSION</text><text x="350" y="178" font-size="22" font-weight="700" fill="#F6F7F8">Content + worker</text><text x="350" y="199" font-size="14" fill="#BFC3C8">Parsing, queue, routing</text></g>
<g><rect x="620" y="104" width="220" height="112" fill="#111315" stroke="#36393C"/><text x="640" y="143" font-size="12" font-weight="700" letter-spacing="1.5" fill="#9EA4A9">03 / ANALYSIS</text><text x="640" y="178" font-size="22" font-weight="700" fill="#F6F7F8">Signals + models</text><text x="640" y="199" font-size="14" fill="#BFC3C8">Heuristics, optional inference</text></g>
<g><rect x="910" y="104" width="250" height="112" fill="#111315" stroke="#D5FF3F"/><text x="930" y="143" font-size="12" font-weight="700" letter-spacing="1.5" fill="#D5FF3F">04 / LOCAL DATA</text><text x="930" y="178" font-size="22" font-weight="700" fill="#F6F7F8">SQLite + dashboard</text><text x="930" y="199" font-size="14" fill="#BFC3C8">Evidence, summaries, controls</text></g>
<g stroke="#D5FF3F" stroke-width="2" fill="none"><path d="M270 160h48m-9-9 9 9-9 9"/><path d="M560 160h48m-9-9 9 9-9 9"/><path d="M850 160h48m-9-9 9 9-9 9"/></g>
<rect x="330" y="276" width="510" height="88" fill="#0E1011" stroke="#36393C"/><text x="354" y="309" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#D5FF3F">OPTIONAL MODEL DOWNLOADS</text><text x="354" y="340" font-family="Arial,sans-serif" font-size="17" fill="#CFD2D5">Model hosts → browser cache → local inference</text>
<path d="M730 216v24H585v26" stroke="#555A5E" stroke-dasharray="5 6" fill="none"/><text x="40" y="398" font-family="Arial,sans-serif" font-size="13" fill="#858B90">The extension has no XRepHunter backend or telemetry collector. X and third-party model hosts still receive their normal browser requests.</text></g>
</svg>
